name: tikkle
description: 티끌가계부 — 가족이 함께 쓰는 영수증 가계부
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  intl: ^0.20.2
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  sign_in_with_apple: ^8.0.0
  google_sign_in: ^7.2.0
  kakao_flutter_sdk_user: ^2.0.0+1
  http: ^1.2.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#E87A3E"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
